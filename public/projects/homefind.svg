<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" rx="14" fill="url(#bgGrad)"/>
  <rect width="400" height="260" rx="14" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>

  <!-- Window Header -->
  <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="32" cy="18" r="4" fill="#eab308" opacity="0.8"/>
  <circle cx="44" cy="18" r="4" fill="#22c55e" opacity="0.8"/>
  <text x="64" y="22" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="600" letter-spacing="1">HOMEFIND • FLUTTER &amp; FIRESTORE</text>
  <rect x="310" y="11" width="75" height="15" rx="7.5" fill="rgba(56,189,248,0.2)"/>
  <circle cx="320" cy="18.5" r="2.5" fill="#38bdf8"/>
  <text x="328" y="22" fill="#7dd3fc" font-family="monospace" font-size="8" font-weight="700">FIREBASE: OK</text>

  <line x1="0" y1="34" x2="400" y2="34" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Mobile App UI Mockup Panel (Left) -->
  <g transform="translate(20, 46)">
    <rect width="165" height="135" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Image placeholder with house graphic -->
    <rect x="8" y="8" width="149" height="58" rx="5" fill="#0284c7" opacity="0.25"/>
    <path d="M 82 22 L 120 48 L 44 48 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="62" y="44" width="40" height="18" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="82" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="700">Emerald Heights Villa</text>
    <text x="12" y="96" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">$780,000</text>
    <text x="12" y="110" fill="#94a3b8" font-family="monospace" font-size="7">3 Bed • 2 Bath • 2,400 sqft</text>
    <rect x="12" y="118" width="141" height="12" rx="3" fill="#0284c7" opacity="0.4"/>
    <text x="46" y="127" fill="#e0f2fe" font-family="monospace" font-size="6.5" font-weight="600">SCHEDULE VIEWING</text>
  </g>

  <!-- Viewing Slot & Atomic Lock Panel (Right) -->
  <g transform="translate(195, 46)">
    <rect width="185" height="135" rx="8" fill="#0b1329" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    <text x="10" y="18" fill="#7dd3fc" font-family="monospace" font-size="8" font-weight="700">📅 REAL-TIME VIEWING SLOTS</text>

    <!-- Slot buttons -->
    <rect x="10" y="26" width="78" height="20" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
    <text x="16" y="39" fill="#86efac" font-family="monospace" font-size="7.5">10:00 AM • AVAIL</text>

    <rect x="96" y="26" width="78" height="20" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
    <text x="102" y="39" fill="#86efac" font-family="monospace" font-size="7.5">02:30 PM • AVAIL</text>

    <!-- Locked slot (Atomic transaction) -->
    <rect x="10" y="52" width="164" height="24" rx="4" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
    <text x="16" y="67" fill="#fca5a5" font-family="monospace" font-size="7.5" font-weight="700">🔒 04:30 PM • LOCKED BY BUYER #84</text>

    <!-- Atomic Lock Info -->
    <rect x="10" y="82" width="164" height="46" rx="4" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="14" y="96" fill="#f59e0b" font-family="monospace" font-size="7" font-weight="700">⚡ FIRESTORE TRANSACTION LOCK</text>
    <text x="14" y="108" fill="#cbd5e1" font-family="monospace" font-size="6.5">Atomic check prevents double-booking</text>
    <text x="14" y="120" fill="#22c55e" font-family="monospace" font-size="6.5">Sync: Instant WebSocket Snapshot</text>
  </g>

  <!-- Bottom Architecture Bar -->
  <rect x="20" y="190" width="360" height="54" rx="6" fill="#020617" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="30" y="208" fill="#38bdf8" font-family="monospace" font-size="8">&gt; Stack: Flutter Client (iOS/Android) ↔ Cloud Firestore ↔ Firebase Auth</text>
  <text x="30" y="222" fill="#94a3b8" font-family="monospace" font-size="8">&gt; Slot Conflict Rate: 0.00% (Strict transaction boundaries)</text>
  <text x="30" y="234" fill="#a7f3d0" font-family="monospace" font-size="7.5">&gt; Agent-Client Direct Messaging: Streamed via Firebase Realtime</text>
</svg>