<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="groqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="localGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" rx="14" fill="url(#bgGrad)"/>
  <rect width="400" height="260" rx="14" fill="url(#grid)"/>
  <rect width="400" height="260" rx="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header -->
  <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="32" cy="18" r="4" fill="#eab308" opacity="0.8"/>
  <circle cx="44" cy="18" r="4" fill="#22c55e" opacity="0.8"/>
  <text x="64" y="22" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="600" letter-spacing="1">HYBRID LLM RESEARCH AGENT</text>
  <rect x="315" y="11" width="70" height="15" rx="7.5" fill="rgba(34,197,94,0.15)"/>
  <circle cx="325" cy="18.5" r="2.5" fill="#22c55e"/>
  <text x="333" y="22" fill="#4ade80" font-family="monospace" font-size="8" font-weight="700">ONLINE</text>

  <line x1="0" y1="34" x2="400" y2="34" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Router Box -->
  <rect x="20" y="44" width="360" height="28" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="30" y="61" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="700">⚡ DUAL INFERENCE ENGINE</text>
  <text x="210" y="61" fill="#64748b" font-family="monospace" font-size="8">Dynamic Context Routing</text>

  <!-- Cloud Lane: Groq API -->
  <rect x="20" y="80" width="360" height="54" rx="8" fill="rgba(249,115,22,0.06)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <circle cx="36" cy="98" r="6" fill="url(#groqGrad)"/>
  <text x="50" y="100" fill="#fed7aa" font-family="monospace" font-size="10" font-weight="700">CLOUD INFERENCE • GROQ API</text>
  <rect x="290" y="90" width="78" height="16" rx="4" fill="rgba(249,115,22,0.2)"/>
  <text x="298" y="102" fill="#ffedd5" font-family="monospace" font-size="8" font-weight="700">540 TOK/S</text>
  <text x="50" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">Synthesizing multi-source papers • Real-time web retrieval</text>

  <!-- Local Lane: Gemma 4B Q4 -->
  <rect x="20" y="142" width="360" height="54" rx="8" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <circle cx="36" cy="160" r="6" fill="url(#localGrad)"/>
  <text x="50" y="162" fill="#bae6fd" font-family="monospace" font-size="10" font-weight="700">LOCAL MODEL • GEMMA 4B (Q4)</text>
  <rect x="290" y="152" width="78" height="16" rx="4" fill="rgba(56,189,248,0.2)"/>
  <text x="302" y="164" fill="#e0f2fe" font-family="monospace" font-size="8" font-weight="700">PRIVATE</text>
  <text x="50" y="184" fill="#94a3b8" font-family="monospace" font-size="8.5">Offline extraction • Zero data egress • Local GPU / Metal</text>

  <!-- Terminal Stream Bar -->
  <rect x="20" y="206" width="360" height="38" rx="6" fill="#020617" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="30" y="222" fill="#38bdf8" font-family="monospace" font-size="8.5">&gt; Agent: Routing deep query to Groq; cached extraction to Gemma.</text>
  <text x="30" y="235" fill="#22c55e" font-family="monospace" font-size="8.5">&gt; Latency: 124ms | Consensus: 98.4% | Tokens Processed: 4,120</text>
</svg>